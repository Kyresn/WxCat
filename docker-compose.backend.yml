# Run this on the x86_64 WeChat host when a remote (for example arm64) gateway
# connects over the network. It extends the full deployment and additionally
# publishes the WeChatFerry RPC bridges and the media agent.
#
#   docker compose -f docker-compose.backend.yml up -d
#
# WARNING: 11086/11087 have no authentication. Publish them only on a trusted
# LAN or VPN. Set WXCAT_WCF_MEDIA_TOKEN to protect 11090.

services:
  wxcat:
    extends:
      file: docker-compose.yml
      service: wxcat
    ports:
      - "11086:11086"
      - "11087:11087"
      - "11090:11090"
    environment:
      # The bridges and the media agent only listen on loopback by default.
      # A remote gateway needs them on all interfaces, and the agent must have
      # a token because it exposes file decrypt/upload.
      WXCAT_WCF_BRIDGE_BIND: 0.0.0.0
      WXCAT_WCF_AGENT_ADDR: 0.0.0.0:11090
      WXCAT_WCF_MEDIA_TOKEN: ${WXCAT_WCF_MEDIA_TOKEN:?set WXCAT_WCF_MEDIA_TOKEN}
