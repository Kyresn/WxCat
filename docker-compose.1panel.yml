# WxCat on 1Panel — linux/amd64 all-in-one deployment.
#
# Joins the existing 1Panel Docker network so AstrBot / DSH containers on the
# same panel can reach WxCat by container name.
#
# 1Panel: Containers -> Compose -> Create, paste this file, fill the required
# variables in the environment section. Or on the host:
#   mkdir -p /opt/1panel/docker/compose/wxcat && cd /opt/1panel/docker/compose/wxcat
#   WXCAT_TOKEN=... WXCAT_WEBUI_TOKEN=... VNC_PASSWORD=... \
#     docker compose -f docker-compose.1panel.yml up -d
#
# Required variables (no insecure defaults):
#   WXCAT_TOKEN         OneBot HTTP/WS access token
#   WXCAT_WEBUI_TOKEN   admin panel token
#   VNC_PASSWORD        noVNC password
#
# Security notes:
#   - Host ports bind to 127.0.0.1 by default. Use a 1Panel reverse proxy, or
#     set WXCAT_BIND_IP=0.0.0.0 to expose them on the LAN.
#   - 1panel-network is shared with every container on the panel. Tokens are
#     mandatory; any container on that network can reach WxCat.
#   - The WeChatFerry bridges (11086/11087) and media agent (11090) bind to
#     127.0.0.1 inside the container, so they are not reachable from the shared
#     network. Remote-gateway setups use docker-compose.backend.yml instead.
#   - The image is pinned to a version tag. Set WXCAT_FULL_IMAGE to a digest
#     (ghcr.io/kyresn/wxcat-wcf@sha256:...) for a fully immutable deploy.
#
# The image already contains WeChat 3.9.12.51 and a ready Wine prefix. First
# start only copies it into ./wine (tens of seconds); no download or install.
# Then open http://<host>:6080/vnc.html and scan the QR code.

services:
  wxcat:
    image: ${WXCAT_FULL_IMAGE:-ghcr.io/kyresn/wxcat-wcf:0.2.5}
    container_name: ${WXCAT_CONTAINER_NAME:-wxcat}
    platform: linux/amd64
    restart: unless-stopped
    shm_size: "512m"
    mem_limit: 6g

    ports:
      - "${WXCAT_BIND_IP:-127.0.0.1}:${WXCAT_WEBUI_PORT:-6099}:6099"   # admin panel
      - "${WXCAT_BIND_IP:-127.0.0.1}:${WXCAT_VNC_PORT:-6080}:6080"     # noVNC, QR login
      - "${WXCAT_BIND_IP:-127.0.0.1}:${WXCAT_HTTP_PORT:-3000}:3000"    # OneBot HTTP API
      - "${WXCAT_BIND_IP:-127.0.0.1}:${WXCAT_WS_PORT:-3001}:3001"      # OneBot forward WS

      # Optional: only needed when a gateway on another machine connects.
      # No authentication on 11086/11087 — trusted LAN or VPN only.
      # - "11086:11086"
      # - "11087:11087"
      # - "11090:11090"

    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./wine:/home/wechat/.wine
      - ./wechat-files:/home/wechat/WeChat Files

    environment:
      TZ: ${TZ:-Asia/Shanghai}
      VNC_PASSWORD: ${VNC_PASSWORD:?set VNC_PASSWORD}
      WXCAT_BACKEND: wcf
      WXCAT_ID_MODE: ${WXCAT_ID_MODE:-numeric}
      WXCAT_TOKEN: ${WXCAT_TOKEN:?set WXCAT_TOKEN}
      WXCAT_WEBUI_TOKEN: ${WXCAT_WEBUI_TOKEN:?set WXCAT_WEBUI_TOKEN}
      WXCAT_MEDIA_BASE_URL: ${WXCAT_MEDIA_BASE_URL:-}

    networks:
      - panel

networks:
  panel:
    external: true
    name: ${PANEL_NETWORK:-1panel-network}
