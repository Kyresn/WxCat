[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

[program:xvfb]
command=Xvfb :1 -screen 0 1280x800x24 -nolisten tcp
user=wechat
priority=10
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=x11vnc -display :1 -forever -shared -rfbauth /home/wechat/.vnc/passwd -rfbport 5900 -noxdamage
user=wechat
priority=20
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=websockify --web=/usr/share/novnc 6080 127.0.0.1:5900
user=wechat
priority=30
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wechat]
command=/opt/wcf/start-wechat.sh
user=wechat
priority=40
autorestart=true
startsecs=3
environment=DISPLAY=":1",HOME="/home/wechat",WINEPREFIX="/home/wechat/.wine",WINEARCH="win64",WINEDEBUG="-all",WINEDLLOVERRIDES="mscoree,mshtml="
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:inject]
command=/opt/wcf/inject.sh
user=wechat
priority=50
autorestart=true
startsecs=2
environment=DISPLAY=":1",HOME="/home/wechat",WINEPREFIX="/home/wechat/.wine",WINEARCH="win64",WINEDEBUG="-all",WINEDLLOVERRIDES="mscoree,mshtml="
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wxcat]
command=/usr/local/bin/wxcat -c /app/config/wxcat.json
user=wechat
priority=60
autorestart=true
startsecs=2
environment=DISPLAY=":1",HOME="/home/wechat",WXCAT_DATA="/app/data",TZ="Asia/Shanghai",WXCAT_BACKEND="%(ENV_WXCAT_BACKEND)s",WXCAT_TOKEN="%(ENV_WXCAT_TOKEN)s",WXCAT_WEBUI_TOKEN="%(ENV_WXCAT_WEBUI_TOKEN)s",WXCAT_ID_MODE="%(ENV_WXCAT_ID_MODE)s"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Media agent used by a remote gateway: decrypts inbound media and stages
# outbound files on the WeChat host.
[program:wcf-agent]
command=/usr/local/bin/wxcat-agent
user=wechat
priority=65
autorestart=true
startsecs=1
environment=HOME="/home/wechat",WCF_CMD_ADDR="tcp://127.0.0.1:10086",WCF_MSG_ADDR="tcp://127.0.0.1:10087",WCF_AGENT_ADDR=":11090",WCF_AGENT_TOKEN="%(ENV_WXCAT_WCF_MEDIA_TOKEN)s",WCF_AGENT_UPLOAD_DIR="/app/data/upload"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Optional bridges that expose the WeChatFerry RPC ports on 0.0.0.0 so a
# gateway running on another machine (for example arm64) can connect.
# They are harmless when 11086/11087 are not published.
[program:wcf-cmd-proxy]
command=socat TCP-LISTEN:11086,fork,reuseaddr TCP:127.0.0.1:10086
user=wechat
priority=70
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:wcf-msg-proxy]
command=socat TCP-LISTEN:11087,fork,reuseaddr TCP:127.0.0.1:10087
user=wechat
priority=70
autorestart=true
startsecs=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
